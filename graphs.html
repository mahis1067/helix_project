<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R Graph Gallery</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <nav>
      <div class="brand"><span class="brand-mark">R</span> Decision Graph Gallery</div>
      <div class="nav-links">
        <a href="/">Dashboard</a>
        <a class="active" href="/graphs.html">Graph gallery</a>
      </div>
    </nav>

    <article class="card" style="margin-bottom:18px">
      <span class="eyebrow">Source: determine_factor.r</span>
      <h1 style="margin:8px 0 4px">Dining hall analysis</h1>
      <p style="color:var(--muted);margin:0">Each graph is generated from the workbook and the R analysis. Open the PDF copy for a print-friendly view.</p>
    </article>

    <section class="gallery-grid">
      <figure class="card graph-card"><img src="/plots/turnout_by_period.png" alt="Turnout by time period"><figcaption>Turnout by time period</figcaption></figure>
      <figure class="card graph-card"><img src="/plots/turnout_by_day.png" alt="Turnout by day"><figcaption>Turnout by day of week</figcaption></figure>
      <figure class="card graph-card"><img src="/plots/turnout_heatmap.png" alt="Turnout heatmap"><figcaption>Average turnout: day × time period</figcaption></figure>
      <figure class="card graph-card"><img src="/plots/turnout_by_week.png" alt="Turnout by week"><figcaption>Turnout by week of term</figcaption></figure>
      <figure class="card graph-card"><img src="/plots/tree1_turnout.png" alt="Turnout decision tree"><figcaption>Turnout decision tree</figcaption></figure>
      <figure class="card graph-card"><img src="/plots/leftover_by_dish.png" alt="Leftovers by dish"><figcaption>Average leftovers by dish</figcaption></figure>
      <figure class="card graph-card"><img src="/plots/leftover_vs_made_per_student.png" alt="Leftovers versus portions"><figcaption>Leftovers versus portions made per student</figcaption></figure>
      <figure class="card graph-card"><img src="/plots/leftover_by_time_of_day.png" alt="Leftovers by time of day"><figcaption>Leftovers by time of day</figcaption></figure>
      <figure class="card graph-card"><img src="/plots/tree2_leftovers.png" alt="Leftover decision tree"><figcaption>Leftover decision tree</figcaption></figure>
      <figure class="card graph-card"><img src="/plots/carbon_by_ingredient.png" alt="Carbon by ingredient"><figcaption>Carbon footprint by ingredient</figcaption></figure>
      <figure class="card graph-card"><img src="/plots/most_consumed_dishes.png" alt="Most consumed dishes"><figcaption>Most consumed dishes</figcaption></figure>
    </section>
  </main>
</body>
</html>
