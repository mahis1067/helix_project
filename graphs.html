<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>R Graph Gallery</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <nav>
      <div class="brand"><span class="brand-mark">R</span> Decision Graph Gallery</div>
      <div class="nav-links">
        <a href="/">Dashboard</a>
        <a href="/inventory.html">Kitchen inventory</a>
        <a class="active" href="/graphs.html">Graph gallery</a>
        <a href="/databases.html">Databases</a>
        <a href="/details.html">How it works</a>
      </div>
    </nav>

    <article class="card" style="margin-bottom:18px">
      <span class="eyebrow">Source: determine_factor.r</span>
      <h1 style="margin:8px 0 4px">Dining hall analysis</h1>
      <p style="color:var(--muted);margin:0">Each graph is generated from the workbook and the R analysis. Open the PDF copy for a print-friendly view.</p>
    </article>

    <section class="gallery-layout">
      <aside class="gallery-sidebar">
        <h3>Available graphs</h3>
        <div class="gallery-list" id="galleryList">
          <button type="button" data-src="/plots/turnout_by_period.png" data-title="Turnout by time period">Turnout by time period</button>
          <button type="button" data-src="/plots/turnout_by_day.png" data-title="Turnout by day of week">Turnout by day of week</button>
          <button type="button" data-src="/plots/turnout_heatmap.png" data-title="Average turnout: day × time period">Turnout heatmap</button>
          <button type="button" data-src="/plots/turnout_by_week.png" data-title="Turnout by week of term">Turnout by week</button>
          <button type="button" data-src="/plots/tree1_turnout.png" data-title="Turnout decision tree">Turnout decision tree</button>
          <button type="button" data-src="/plots/leftover_by_dish.png" data-title="Average leftovers by dish">Leftovers by dish</button>
          <button type="button" data-src="/plots/leftover_vs_made_per_student.png" data-title="Leftovers versus portions made per student">Leftover efficiency</button>
          <button type="button" data-src="/plots/leftover_by_time_of_day.png" data-title="Leftovers by time of day">Leftovers by time</button>
          <button type="button" data-src="/plots/tree2_leftovers.png" data-title="Leftover decision tree">Leftover decision tree</button>
          <button type="button" data-src="/plots/carbon_by_ingredient.png" data-title="Carbon footprint by ingredient">Carbon by ingredient</button>
          <button type="button" data-src="/plots/most_consumed_dishes.png" data-title="Most consumed dishes">Most consumed dishes</button>
        </div>
      </aside>
      <article class="card gallery-viewer">
        <h2 id="galleryTitle">Turnout by time period</h2>
        <img id="galleryImage" src="/plots/turnout_by_period.png" alt="Turnout by time period">
      </article>
    </section>
    <script>
      const graphButtons = document.querySelectorAll("#galleryList button");
      graphButtons.forEach(button => button.addEventListener("click", () => {
        graphButtons.forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        document.querySelector("#galleryTitle").textContent = button.dataset.title;
        const image = document.querySelector("#galleryImage");
        image.src = button.dataset.src;
        image.alt = button.dataset.title;
      }));
      graphButtons[0].classList.add("active");
    </script>
  </main>
</body>
</html>
