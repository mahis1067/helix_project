<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Databases</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <nav>
      <div class="brand"><span class="brand-mark">DH</span> Dining Hall Intelligence</div>
      <div class="nav-links">
        <a href="/">Dashboard</a>
        <a href="/inventory.html">Kitchen inventory</a>
        <a href="/graphs.html">Graph gallery</a>
        <a class="active" href="/databases.html">Databases</a>
        <a href="/details.html">How it works</a>
      </div>
    </nav>

    <article class="card" style="margin-bottom:18px">
      <span class="eyebrow">Workbook explorer</span>
      <h1 style="margin:8px 0 4px">Database tables</h1>
      <p style="color:var(--muted);margin:0">View the source data and derived tables currently stored in the Excel workbook.</p>
    </article>

    <article class="card" style="margin-bottom:18px">
      <h2 style="margin-top:0">Add a database entry</h2>
      <div class="entry-tabs">
        <button class="active" data-table="table1_attendance">Attendance</button>
        <button data-table="table2_dishes">Dish</button>
        <button data-table="table3_ingredients">Purchase</button>
      </div>

      <form id="attendanceForm" class="entry-form" data-table="table1_attendance">
        <label>Date<input type="date" name="date" required></label>
        <label>Day<select name="day" required><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select></label>
        <label>Time<select name="time_period" required><option>morning</option><option>afternoon</option><option>evening</option></select></label>
        <label>Students<input type="number" name="number_of_students" min="0" required></label>
        <button class="primary" type="submit">Add attendance</button>
      </form>

      <form id="dishForm" class="entry-form hidden" data-table="table2_dishes">
        <label>Date<input type="date" name="date" required></label>
        <label>Dish<input name="dish" required></label>
        <label>Ingredients<input name="ingredients" placeholder="chicken, lettuce, cheese" required></label>
        <label>Amount made<input type="number" name="amount_made" min="1" required></label>
        <label>Time<select name="time_of_day_served" required><option>morning</option><option>afternoon</option><option>evening</option></select></label>
        <label>Leftover<input type="number" name="leftover" min="0" required></label>
        <button class="primary" type="submit">Add dish</button>
      </form>

      <form id="purchaseForm" class="entry-form hidden" data-table="table3_ingredients">
        <label>Purchase date<input type="date" name="purchase_date" required></label>
        <label>Ingredient<input name="ingredient_bought" required></label>
        <label>Amount (kg)<input type="number" name="amount_kg" min="0.01" step="0.01" required></label>
        <button class="primary" type="submit">Add purchase</button>
      </form>
      <div id="entryStatus" class="status"></div>
    </article>

    <section class="database-layout">
      <aside class="database-sidebar">
        <h3>Tables</h3>
        <div id="databaseList" class="database-list"></div>
      </aside>
      <article class="card database-table">
        <h2 id="databaseTitle">Loading...</h2>
        <div class="table-wrap">
          <table><thead id="databaseHead"></thead><tbody id="databaseBody"></tbody></table>
        </div>
      </article>
    </section>
  </main>
  <script>
    let tables = {};

    function showTable(name) {
      document.querySelectorAll(".database-list button").forEach(button =>
        button.classList.toggle("active", button.dataset.table === name));
      const table = tables[name];
      document.querySelector("#databaseTitle").textContent = name;
      document.querySelector("#databaseHead").innerHTML =
        "<tr>" + table.headers.map(header => `<th>${header}</th>`).join("") + "</tr>";
      document.querySelector("#databaseBody").innerHTML = table.rows.map(row =>
        "<tr>" + table.headers.map(header =>
          `<td>${row[header] == null ? "" : String(row[header])}</td>`
        ).join("") + "</tr>"
      ).join("");
    }

    fetch("/api/databases").then(response => response.json()).then(result => {
      tables = result.tables;
      const list = document.querySelector("#databaseList");
      list.innerHTML = Object.keys(tables).map(name =>
        `<button type="button" data-table="${name}">${name}</button>`
      ).join("");
      document.querySelectorAll(".database-list button").forEach(button =>
        button.addEventListener("click", () => showTable(button.dataset.table)));
      showTable(Object.keys(tables)[0]);
    });

    document.querySelectorAll(".entry-tabs button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".entry-tabs button").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        document.querySelectorAll(".entry-form").forEach(form => form.classList.add("hidden"));
        document.querySelector(`.entry-form[data-table="${button.dataset.table}"]`).classList.remove("hidden");
      });
    });

    document.querySelectorAll(".entry-form").forEach(form => {
      form.addEventListener("submit", async event => {
        event.preventDefault();
        const payload = Object.fromEntries(new FormData(form));
        payload.table = form.dataset.table;
        const status = document.querySelector("#entryStatus");
        status.textContent = "Saving...";
        try {
          const response = await fetch("/api/add", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error);
          status.textContent = "Entry added to the workbook.";
          form.reset();
          const refreshed = await fetch("/api/databases").then(response => response.json());
          tables = refreshed.tables;
          showTable(buttonTableName(payload.table));
        } catch (error) {
          status.textContent = error.message;
          status.style.color = "#b42318";
        }
      });
    });

    function buttonTableName(table) {
      return table;
    }
  </script>
</body>
</html>
